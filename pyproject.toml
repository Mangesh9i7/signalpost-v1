[project]
name = "norway-company-agent-poc"
version = "0.1.0"
description = "Norwegian company research agent for the Builderr Signalpost challenge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "lxml>=6,<7",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]

[project.optional-dependencies]
llm = [
  "openai>=1.40,<2",
]

sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
